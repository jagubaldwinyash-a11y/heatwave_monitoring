<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Heatwave Hotspot Map</h2>
    <img src="map.jpg" alt="Heatwave Map" usemap="#heatmap" width="600">
    <map name="heatmap">
        <area shape="rect" coords="50,50,220,180" href="north.html" alt="North Zone">
        <area shape="rect" coords="250,200,450,350" href="central.html" alt="Central Zone">
    </map>
    <p>Click on any region to see more details.</p>

</body>
</html>
